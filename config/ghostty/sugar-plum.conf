# Sugar Plum — Ghostty include.
# Loaded last from ~/.config/ghostty/config via: config-file = sugar-plum.conf

background = 1e1e2e
foreground = ede6f5
cursor-color = ffb3d9
cursor-text = 1e1e2e
selection-background = 45475a
selection-foreground = ede6f5

# Frosted glass: translucent enough to see the wallpaper, blurred enough to stay quiet.
background-opacity = 0.78
background-opacity-cells = true
background-blur = 40

window-padding-x = 12
window-padding-y = 10

palette = 0=#3a3145
palette = 1=#f38ba8
palette = 2=#b8e6c8
palette = 3=#f7e1b5
palette = 4=#aec6ff
palette = 5=#e6c3ff
palette = 6=#b8e6e6
palette = 7=#ede6f5
palette = 8=#5a4c6b
palette = 9=#ffb3d9
palette = 10=#c9efd5
palette = 11=#f9e9c8
palette = 12=#c2d4ff
palette = 13=#efd4ff
palette = 14=#cdefef
palette = 15=#ffffff
